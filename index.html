<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!-- Seguridad: solo se ejecuta código de los archivos de la app (nada inyectado ni de otros sitios). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>App Finanzas Personal</title>
    <meta name="description" content="Anotá gastos e ingresos en segundos y mirá si te estás pasando del presupuesto, sin conexión.">
    <meta name="theme-color" content="#070a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finanzas">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <!-- Pantalla de carga al abrir desde el ícono (una por tamaño de iPhone; las genera tools/make-icons.mjs). -->
    <link rel="apple-touch-startup-image" href="icons/splash/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/splash/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/splash/splash-1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/splash/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/splash/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/splash/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/splash/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <!-- Fondo oscuro desde el primer instante, antes de que cargue el CSS: sin flash blanco. -->
    <style>
      html, body { background: #070a0f; }
      /* Pantalla de carga dentro de la app (solo en celular). La moneda queda en el mismo lugar y tamaño que
         en las imágenes de icons/splash, así el paso de la pantalla nativa a esta no se nota. app.js la saca. */
      .splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #070a0f;
        transition: opacity .35s ease; }
      .splash img { width: 104px; height: 104px; animation: splash-in .6s ease-out both; transition: transform .35s ease; }
      .splash span { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 40px);
        text-align: center; font: 700 17px/1 'Outfit', system-ui, sans-serif; letter-spacing: .02em; color: #1fbf8f;
        animation: splash-fade .5s .15s ease-out both; }
      .splash.out { opacity: 0; pointer-events: none; }
      .splash.out img { transform: scale(1.15); }
      @keyframes splash-in { from { transform: scale(.94); } }
      @keyframes splash-fade { from { opacity: 0; } }
      @media (pointer: fine) { .splash { display: none; } }
      @media (prefers-reduced-motion: reduce) { .splash img, .splash span { animation: none; transition: none; } }
    </style>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true"><img src="icons/icon.svg" alt=""><span>Finanzas</span></div>
    <div id="app"></div>
    <dialog id="sheet" class="sheet"></dialog>
    <noscript>AppFinanzas necesita JavaScript para funcionar.</noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
